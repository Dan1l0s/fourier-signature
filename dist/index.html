    <style>
:root {
  color-scheme: light;
  --canvas-bg: #ffffff;
  --ink: #1f2328;
  --muted: #68727e;
  --geometry: #267da4;
  --border: #d0d7de;

  --track: #d8dee5;
  --focus: #0969da;
  --error: #b42318;

  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas-bg: #0d1117;
  --ink: #e6edf3;
  --muted: #8b949e;
  --geometry: #7bc9e8;
  --border: #30363d;
  --control-bg: #0d1117;
  --control-hover: #161b22;
  --track: #30363d;
  --focus: #79c0ff;
  --error: #ff9b94;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]),
  :root[data-theme="auto"] {
    color-scheme: dark;
    --canvas-bg: #0d1117;
    --ink: #e6edf3;
    --muted: #8b949e;
    --geometry: #7bc9e8;
    --border: #30363d;
    --control-bg: #0d1117;
    --control-hover: #161b22;
    --track: #30363d;
    --focus: #79c0ff;

  }
}

* {
  box-sizing: border-box;
}

body {
  min-width: 280px;
  margin: 0;
  background: var(--canvas-bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
}

.app {
  width: min(100%, 1200px);
  margin-inline: auto;
  padding: 28px 40px 24px;
}

.page-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

  margin: 0;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.header-signature {
  color: var(--muted);
  font-size: 13px;
}

.canvas-stage {
  width: 100%;
  aspect-ratio: 1.94;
  background: var(--canvas-bg);
}

#signatureCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.controls {
  margin-top: 6px;
}

.playback-row {
  display: flex;
  align-items: flex-end;
  gap: 28px;
}

.timeline-control {
  min-width: 0;
  flex: 1;
}

.timeline-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 12px;
}

#progressLabel {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

button,
select,
input {
  font: inherit;
}

button,
select {
  min-height: 38px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control-bg);
  color: var(--ink);
}

button {
  padding: 7px 16px;
  cursor: pointer;
  white-space: nowrap;
}

button:hover,
select:hover {
  background-color: var(--control-hover);
}

button:active {
  transform: translateY(1px);
}

button:disabled,
select:disabled {
  opacity: 0.5;
  cursor: default;
}

  transform: none;
}

button:focus-visible,
select:focus-visible,
input:focus-visible,

  outline: 2px solid var(--focus);
  outline-offset: 4px;

  min-width: 132px;
  font-weight: 500;
}

  width: 100%;
  height: 25px;
  margin: 1px 0 0;

  grid-template-columns: minmax(160px, 1.3fr) minmax(120px, 1fr) minmax(90px, 0.6fr) auto;

  flex-direction: column;

@media (max-width: 760px) {

  }

    height: 36px;
  }

  button:active {
    transform: none;
  }

  <body>
    <div id="app" class="app">
      <header class="page-header">
        <h1>Fourier signature</h1>
        <span class="header-signature">Dan1l0s</span>
      </header>

      <main>
        <section class="drawing" aria-label="Подпись Фурье">
          <div id="canvasStage" class="canvas-stage">
            <canvas id="signatureCanvas" width="1440" height="720" role="img" aria-label="Одна цепочка вращающихся окружностей рисует надпись Dan1l0s шрифтом Oxanium.">
              Одна цепочка эпициклов Фурье рисует надпись Dan1l0s.
            </canvas>
          </div>
          <noscript>

          </noscript>

                </label>

              <label class="field mode-field" for="traceMode">
                <span>Линия</span>
                <select id="traceMode">
                  <option value="continuous" selected>Непрерывная</option>
                  <option value="masked">Без перемычек</option>

                <span>Тема</span>

      </footer>

    <script type="module">
const Fourier = (() => {

const TAU = Math.PI * 2;

function transform(points, inverse) {
  const size = points.length;
  if (!size || !Number.isInteger(Math.log2(size))) {
    throw new RangeError('FFT input length must be a power of two.');
  }
  const real = new Float64Array(size);
  const imag = new Float64Array(size);
  for (let i = 0; i < size; i++) {
    const point = points[i];
    const tuple = Array.isArray(point) || ArrayBuffer.isView(point);
    real[i] = tuple ? point[0] : point.x;
    imag[i] = tuple ? point[1] : point.y;
    if (!Number.isFinite(real[i]) || !Number.isFinite(imag[i])) {
      throw new TypeError('FFT points must contain two finite coordinates.');
    }
  }

  // Bit reversal puts the input in the order used by the butterfly passes.
  for (let i = 1, reversed = 0; i < size; i++) {
    let bit = size >> 1;
    while (reversed & bit) {
      reversed ^= bit;
      bit >>= 1;
    }
    reversed ^= bit;
    if (i < reversed) {
      [real[i], real[reversed]] = [real[reversed], real[i]];
      [imag[i], imag[reversed]] = [imag[reversed], imag[i]];
    }
  }

  for (let width = 2; width <= size; width *= 2) {
    const angle = (inverse ? TAU : -TAU) / width;
    const rotationReal = Math.cos(angle);
    const rotationImag = Math.sin(angle);
    const half = width / 2;
    for (let start = 0; start < size; start += width) {
      let cosine = 1;
      let sine = 0;
      for (let offset = 0; offset < half; offset++) {
        const even = start + offset;
        const odd = even + half;
        const oddReal = real[odd] * cosine - imag[odd] * sine;
        const oddImag = real[odd] * sine + imag[odd] * cosine;
        real[odd] = real[even] - oddReal;
        imag[odd] = imag[even] - oddImag;
        real[even] += oddReal;
        imag[even] += oddImag;
        const nextCosine = cosine * rotationReal - sine * rotationImag;
        sine = sine * rotationReal + cosine * rotationImag;
        cosine = nextCosine;
      }
    }
  }
  const scale = inverse ? 1 / size : 1;
  return Array.from({ length: size }, (_, i) => [real[i] * scale, imag[i] * scale]);
}

function fft(points) {
  return transform(points, false);
}

function ifft(coefficients) {
  return transform(coefficients, true);
}

function toHarmonics(points, count = points.length) {
  if (!Number.isInteger(count) || count < 1) {
    throw new RangeError('The harmonic count must be a positive integer.');
  }
  const size = points.length;
  const coefficients = fft(points);
  const harmonics = coefficients.map(([real, imag], index) => [
    index < size / 2 ? index : index - size,
    real / size,
    imag / size
  ]);
  const dc = harmonics.shift();
  harmonics.sort((a, b) =>
    (b[1] ** 2 + b[2] ** 2) - (a[1] ** 2 + a[2] ** 2)
    || Math.abs(a[0]) - Math.abs(b[0]) || a[0] - b[0]
  );
  return [dc, ...harmonics.slice(0, count - 1)];
}

function evaluateHarmonics(harmonics, phase) {
  if (!Number.isFinite(phase)) throw new TypeError('The phase must be finite.');
  const angle = TAU * (phase % 1);
  let x = 0;
  let y = 0;
  for (const [frequency, real, imag] of harmonics) {
    const cosine = Math.cos(angle * frequency);
    const sine = Math.sin(angle * frequency);
    x += real * cosine - imag * sine;
    y += real * sine + imag * cosine;
  }
  return { x, y };
}

return {fft, ifft, toHarmonics, evaluateHarmonics};
})();

const Renderer = (() => {
const {evaluateHarmonics} = Fourier;

const TAU = Math.PI * 2;
const clamp01 = value => Math.max(0, Math.min(1, value));

function beginStroke(ctx, color, width, opacity) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = opacity;
  ctx.beginPath();
}

function createScene(data, options = {}) {
  if (!(data?.width > 0) || !(data?.height > 0) || !Array.isArray(data.harmonics)) {
    throw new TypeError('A positive word bounding box and complex harmonics are required.');
  }
  const harmonics = [];
  let dcX = 0;
  let dcY = 0;
  let dcCount = 0;
  let maxFrequency = 0;
  let derivativeSum = 0;
  for (const [frequency, real, imag] of data.harmonics) {
    if (!Number.isInteger(frequency) || !Number.isFinite(real) || !Number.isFinite(imag)) {
      throw new TypeError('Harmonics need integer frequencies and finite complex amplitudes.');
    }
    if (frequency === 0) {
      dcX += real;
      dcY += imag;
      dcCount++;
    } else {
      const amplitude = Math.hypot(real, imag);
      harmonics.push({ frequency, real, imag, amplitude });
      maxFrequency = Math.max(maxFrequency, Math.abs(frequency));
      derivativeSum += Math.abs(frequency) * amplitude;
    }
  }
  harmonics.sort((a, b) => b.amplitude - a.amplitude
    || Math.abs(a.frequency) - Math.abs(b.frequency) || a.frequency - b.frequency);

  const samples = 2 ** Math.ceil(Math.log2(Math.max(8192, 2 * maxFrequency + 1)));
  const pathX = new Float64Array(samples + 1);
  const pathY = new Float64Array(samples + 1);
  let minX = -dcX;
  let maxX = data.width - dcX;
  let minY = -dcY;
  let maxY = data.height - dcY;

  // Cache the trace and measure every circle over the full cycle.
  for (const harmonic of harmonics) {
    const angle = TAU * harmonic.frequency / samples;
    const rotationX = Math.cos(angle);
    const rotationY = Math.sin(angle);
    let cosine = 1;
    let sine = 0;
    for (let i = 0; i < samples; i++) {
      const x = pathX[i];
      const y = pathY[i];
      minX = Math.min(minX, x - harmonic.amplitude);
      maxX = Math.max(maxX, x + harmonic.amplitude);
      minY = Math.min(minY, y - harmonic.amplitude);
      maxY = Math.max(maxY, y + harmonic.amplitude);
      pathX[i] = x + harmonic.real * cosine - harmonic.imag * sine;
      pathY[i] = y + harmonic.real * sine + harmonic.imag * cosine;
      const nextCosine = cosine * rotationX - sine * rotationY;
      sine = sine * rotationX + cosine * rotationY;
      cosine = nextCosine;
    }
  }
  pathX[samples] = pathX[0];
  pathY[samples] = pathY[0];

  // Bound the motion between samples: |z'(t)| <= 2π sum(|k c[k]|).
  const allowance = Math.PI * derivativeSum / samples + 1e-6;
  minX -= allowance;
  maxX += allowance;
  minY -= allowance;
  maxY += allowance;
  const radiusX = Math.max(-minX, maxX);
  const radiusY = Math.max(-minY, maxY);
  const coefficients = harmonics.map(h => [h.frequency, h.real, h.imag]);
  const evaluate = phase => evaluateHarmonics(coefficients, phase);

  const intervals = [];
  let cursor = 0;
  for (const source of [...(data.intervals || [])].sort((a, b) => a.start - b.start)) {
    const start = clamp01(Number(source.start));
    const end = clamp01(Number(source.end));
    if (!Number.isFinite(start) || !Number.isFinite(end) || end < start || start < cursor - 1e-9) {
      throw new TypeError('Ink intervals must be finite, ordered, and non-overlapping.');
    }
    if (start > cursor + 1e-12) intervals.push({ start: cursor, end: start, ink: false });
    if (end > start) intervals.push({ start, end, ink: Boolean(source.ink) });
    cursor = end;
  }
  if (!intervals.length) intervals.push({ start: 0, end: 1, ink: true });
  else if (cursor < 1) intervals.push({ start: cursor, end: 1, ink: false });
  for (const interval of intervals) {
    interval.startPoint = evaluate(interval.start);
    interval.endPoint = evaluate(interval.end);
    interval.firstSample = Math.floor(interval.start * samples) + 1;
    interval.lastSample = Math.floor(interval.end * samples);
  }
  const chainX = new Float64Array(harmonics.length + 1);
  const chainY = new Float64Array(harmonics.length + 1);

  function appendInterval(ctx, interval, phase, tip, anchorX, anchorY, scale) {
    const end = Math.min(interval.end, phase);
    if (end <= interval.start) return;
    ctx.moveTo(anchorX + interval.startPoint.x * scale, anchorY + interval.startPoint.y * scale);
    const last = Math.min(interval.lastSample, Math.floor(end * samples));
    for (let i = interval.firstSample; i <= last; i++) {
      ctx.lineTo(anchorX + pathX[i] * scale, anchorY + pathY[i] * scale);
    }
    const point = end === interval.end ? interval.endPoint : tip;
    ctx.lineTo(anchorX + point.x * scale, anchorY + point.y * scale);
  }

  return {
    options,
    draw(ctx, width, height, progress, palette, showTransfers = true) {
      const w = Math.max(1, Number(width) || 1);
      const h = Math.max(1, Number(height) || 1);
      const phase = clamp01(Number(progress) || 0);
      const complete = phase === 1;
      const margin = Math.max(12, Math.min(24, Math.min(w, h) * 0.055));
      const anchorX = w / 2;
      const anchorY = h / 2;
      const fit = options.fit === 'word' ? 'word' : 'construction';
      const widthRatio = Number.isFinite(options.wordWidthRatio)
        ? Math.max(0.1, Math.min(0.96, options.wordWidthRatio)) : 0.82;
      const scale = fit === 'word'
        ? Math.min(w * widthRatio / data.width, Math.max(1, h - margin * 2) / data.height)
        : Math.min(Math.max(1, w - margin * 2) / (2 * radiusX), Math.max(1, h - margin * 2) / (2 * radiusY));
      const angle = TAU * (complete ? 0 : phase);
      chainX[0] = 0;
      chainY[0] = 0;
      let visibleCircles = 0;
      for (let i = 0; i < harmonics.length; i++) {
        const harmonic = harmonics[i];
        const cosine = Math.cos(angle * harmonic.frequency);
        const sine = Math.sin(angle * harmonic.frequency);
        chainX[i + 1] = chainX[i] + harmonic.real * cosine - harmonic.imag * sine;
        chainY[i + 1] = chainY[i] + harmonic.real * sine + harmonic.imag * cosine;
        if (harmonic.amplitude * scale > 1.5) visibleCircles++;
      }
      const tip = { x: chainX[harmonics.length], y: chainY[harmonics.length] };
      const tipX = anchorX + tip.x * scale;
      const tipY = anchorY + tip.y * scale;
      let activeInterval = intervals.findIndex(interval => phase < interval.end);
      if (activeInterval < 0) activeInterval = intervals.length - 1;
      const endOpacity = Number.isFinite(options.endConstructionOpacity)
        ? clamp01(options.endConstructionOpacity) : 0.9;
      const constructionOpacity = complete ? endOpacity : 1;
      const showConstruction = options.showEpicycles !== false && constructionOpacity > 0;

      ctx.save();
      ctx.globalAlpha = 1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.setLineDash([]);
      ctx.fillStyle = palette.bg;
      ctx.fillRect(0, 0, w, h);

      if (!complete && options.showGuides !== false) {
        beginStroke(ctx, palette.muted, 0.55, 0.18);
        for (const points of data.originals || []) {
          if (!points.length) continue;
          ctx.moveTo(anchorX + (points[0][0] - dcX) * scale, anchorY + (points[0][1] - dcY) * scale);
          for (let i = 1; i < points.length; i++) {
            ctx.lineTo(anchorX + (points[i][0] - dcX) * scale, anchorY + (points[i][1] - dcY) * scale);
          }
          ctx.closePath();
        }
        ctx.stroke();
      }
      if (showConstruction) {
        beginStroke(ctx, palette.accent, 1.05, 0.76 * constructionOpacity);
        for (let i = 0; i < harmonics.length; i++) {
          const radius = harmonics[i].amplitude * scale;
          if (radius <= 1.5) continue;
          const x = anchorX + chainX[i] * scale;
          const y = anchorY + chainY[i] * scale;
          ctx.moveTo(x + radius, y);
          ctx.arc(x, y, radius, 0, TAU);
        }
        ctx.stroke();
        beginStroke(ctx, palette.fg, 0.8, 0.45 * constructionOpacity);
        ctx.moveTo(anchorX, anchorY);
        for (let i = 1; i < chainX.length; i++) {
          ctx.lineTo(anchorX + chainX[i] * scale, anchorY + chainY[i] * scale);
        }
        ctx.stroke();
      }

      // Both modes use the same series. The mask only hides bridge strokes.
      if (showTransfers && phase > 0) {
        beginStroke(ctx, palette.fg, 0.95, 0.75);
        ctx.moveTo(anchorX + pathX[0] * scale, anchorY + pathY[0] * scale);
        const last = Math.min(samples, Math.floor(phase * samples));
        for (let i = 1; i <= last; i++) {
          ctx.lineTo(anchorX + pathX[i] * scale, anchorY + pathY[i] * scale);
        }
        ctx.lineTo(tipX, tipY);
        ctx.stroke();
      }

const Svg = (() => {

const escape = value => String(value).replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;');
const number = value => Number(value.toFixed(3));

  constructor() {
    this.elements = [];
    this.path = [];
    this.stack = [];
    this.globalAlpha = 1;
    this.lineWidth = 1;
    this.lineCap = 'round';
    this.lineJoin = 'round';
    this.fillStyle = '#000';
    this.strokeStyle = '#000';
    this.dash = [];

    const {globalAlpha, lineWidth, lineCap, lineJoin, fillStyle, strokeStyle, dash} = this;
    this.stack.push({globalAlpha, lineWidth, lineCap, lineJoin, fillStyle, strokeStyle, dash});

  restore() { Object.assign(this, this.stack.pop()); }
  setLineDash(dash) { this.dash = [...dash]; }
  beginPath() { this.path = []; }
  moveTo(x, y) { this.path.push(`M${number(x)} ${number(y)}`); }
  lineTo(x, y) { this.path.push(`L${number(x)} ${number(y)}`); }

    if (!this.path.length) return;

const App = (() => {
const {createScene} = Renderer;
const {renderSvg} = Svg;

function startApp(data) {
  const canvas = document.getElementById('signatureCanvas');
  const context = canvas.getContext('2d');
  const play = document.getElementById('playPause');
  const mode = document.getElementById('traceMode');
  const theme = document.getElementById('themeMode');
  const speed = document.getElementById('playbackSpeed');
  const timeline = document.getElementById('timeline');
  const progressLabel = document.getElementById('progressLabel');
  const status = document.getElementById('statusMessage');
  const darkTheme = matchMedia('(prefers-color-scheme: dark)');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const scene = createScene(data, {
    fit: 'word',
    wordWidthRatio: 0.82,
    endConstructionOpacity: 0.9
  });

  const duration = 22;
  let progress = 1;
  let playing = false;
  let frame = 0;
  let lastTime = 0;
  let width = 736;
  let height = 380;
  let pixelRatio = 1;
  let palette;

  function readPalette() {
    const style = getComputedStyle(document.documentElement);
    const color = name => style.getPropertyValue(name).trim();
    palette = {
      bg: color('--canvas-bg'),
      fg: color('--ink'),
      muted: color('--muted'),
      accent: color('--geometry')
    };
  }

  function draw() {
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    scene.draw(context, width, height, progress, palette, mode.value === 'continuous');
    timeline.value = progress;
    progressLabel.value = Math.round(progress * 100) + '%';
    timeline.setAttribute('aria-valuetext', progressLabel.value);
  }

  function resize() {
    const box = canvas.getBoundingClientRect();
    width = Math.max(1, box.width);
    height = Math.max(1, box.height);
    pixelRatio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    draw();
  }

  function updateStatus() {
    const trace = mode.value === 'continuous' ? 'Непрерывная линия' : 'Перо поднято на переходах';
    const state = playing ? 'Рисование' : progress === 1 ? 'Готово' : 'Пауза';
    status.textContent = state + ' · ' + trace;
  }

  function updateButton() {
    play.textContent = playing ? 'Пауза' : progress === 1 ? 'Нарисовать ещё раз' : 'Продолжить';
    if (reducedMotion.matches) play.textContent = progress === 1 ? 'Начать по шагам' : 'Следующий шаг';
    play.setAttribute('aria-pressed', String(playing));
  }

  function pause() {
    playing = false;
    cancelAnimationFrame(frame);
    updateButton();
    updateStatus();
  }

  function tick(now) {
    if (!playing) return;
    progress = Math.min(1, progress + (now - lastTime) / 1000 * Number(speed.value) / duration);
    lastTime = now;
    draw();
    if (progress === 1) pause();
    else frame = requestAnimationFrame(tick);
  }

  play.addEventListener('click', () => {
    if (playing) return pause();
    if (progress === 1) progress = 0;
    if (reducedMotion.matches) {
      progress = Math.min(1, progress + 0.05);
      draw();
      updateButton();
      updateStatus();
      return;
    }
    playing = true;
    lastTime = performance.now();
    updateButton();
    updateStatus();
    draw();
    frame = requestAnimationFrame(tick);
  });

  timeline.addEventListener('input', () => {
    pause();
    progress = Number(timeline.value);
    draw();
    updateButton();
    updateStatus();
  });

  mode.addEventListener('change', () => {
    draw();
    updateStatus();
  });

  function setTheme() {
    document.documentElement.dataset.theme = theme.value;
    readPalette();
    draw();
  }

  theme.addEventListener('change', setTheme);
  darkTheme.addEventListener('change', setTheme);
  reducedMotion.addEventListener('change', () => {
    if (playing) pause();
    updateButton();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) pause();
  });

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  document.getElementById('exportPng').addEventListener('click', () => {
    const image = document.createElement('canvas');
    image.width = Math.round(width * 2);
    image.height = Math.round(height * 2);
    const imageContext = image.getContext('2d');
    imageContext.scale(2, 2);
    scene.draw(imageContext, width, height, progress, palette, mode.value === 'continuous');
    image.toBlob(blob => {
      if (!blob) { status.textContent = 'Не удалось сохранить PNG.'; return; }
      download(blob, 'dan1l0s-fourier.png');
      status.textContent = 'Текущий кадр сохранён в PNG.';
    }, 'image/png');
  });

  document.getElementById('exportSvg').addEventListener('click', () => {
    const svg = renderSvg(scene, {
      width, height, progress, palette,
      showTransfers: mode.value === 'continuous'
    });
    download(new Blob([svg], {type: 'image/svg+xml'}), 'dan1l0s-fourier.svg');
    status.textContent = 'Текущий кадр сохранён в SVG.';
  });

  readPalette();
  resize();
  new ResizeObserver(resize).observe(document.getElementById('canvasStage'));
  updateStatus();
  if (reducedMotion.matches) updateButton();
}

return {startApp};
})();
